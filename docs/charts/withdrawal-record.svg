<text x="38.0" y="404.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" style="">13 of the 67 withdrawn plans (19%) name the number they were resubmitted under, so a withdrawal is not always a death.</text>
<text x="38.0" y="424.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" style="">Only 2 of those also carry a date, which is why the blue is thinner here than that 19% implies.</text>
