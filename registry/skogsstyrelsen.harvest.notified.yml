# Field shape verified against the live service on 2026-09-04.
source_id: skogsstyrelsen.harvest.notified
status: active
cadence: monthly
schema_id: harvest.notified.v1

publisher: Skogsstyrelsen
publisher_tier: first_party
destroys_own_history: true
licence: "Skogsstyrelsen open data (Geodataportalen); verify terms before redistributing"
personal_data: none          # Beteckn is a case number; no holder or owner field exists
storage: git

notes: >-
  Swedish harvest notifications — the intention to fell, filed before the work.
  The reason this is captured and the performed-harvest layer is not: Sweden
  keeps 1,381,643 performed-harvest records back to 1979, and keeps
  notifications only from 2021. Intentions age out on roughly a five-year
  rolling window; outcomes are kept for ever. A notification that never became
  a harvest disappears with no trace.
  Two things this source cannot do, both tested rather than assumed. There is
  no join to the performed layer: it redacts Beteckn to 'Visas ej'. And AvvHa
  is not a completion rate — 95,315 of 128,192 rows read 'Uppgift saknas',
  meaning the outcome is unknown, not that no harvest happened.
  Partitioned by county and case year, with bi-monthly or quarterly bands where
  a cell would approach the 2,000-feature cap. orderByFields is mandatory: the
  service returns rows in a different order on every request, so without it the
  payload hash changes each capture and dedup never fires.

