gates:
  expect_status: 200
  min_bytes: 3000
  content_type_any: [json]
  must_contain: ["PLAN_STAT"]
  # Truncation guard: the service caps a response at 2,000 features and says so
  # in the payload while still returning HTTP 200. Every partition is sized well
  # under that, so this firing means the ranges need re-splitting.
  must_not_contain: ['exceededTransferLimit":true', "Access Denied"]
  max_shrink_pct: 40
