# Field shape verified against the live service on 2026-09-04.
#
# Partitioned on HD_NUM string ranges. HD_NUM is <region>-<year>-<seq>-<county>,
# a business key, not a surrogate id — the WA mining layer taught that lesson
# the hard way when every gid was reassigned in a refresh. Fourteen partitions,
# largest 1,088 rows against the service's 2,000 cap.
source_id: calfire.harvest.proposed
status: active
cadence: weekly
schema_id: harvest.v1

publisher: CAL FIRE
publisher_tier: first_party
destroys_own_history: true
licence: "California state open data; see https://data.ca.gov/ and CAL FIRE's terms"
personal_data: none          # this layer carries no owner fields — see notes
storage: git

notes: >-
  Proposed timber harvest plans. PLAN_STAT is a three-state pipeline —
  Proposed, Withdrawn, Denied — and the withdrawn population does not survive
  into CAL FIRE's permanent 76,967-record THP archive: of 20 withdrawn plans
  sampled by HD_NUM, none appeared there. A third of proposed acreage is
  already withdrawn, and that acreage is being erased rather than archived.
  Geometry is requested at ~22 m generalisation so maps are possible without
  the archive carrying full-resolution polygons. Unlike the permanent THP
  layer, this one has no LANDOWNER or TIMBEROWNR field, so no personal data.

